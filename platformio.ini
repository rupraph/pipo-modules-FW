; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


;Memo: extends cannot ineherit from lib_extra_dirs from generic section (not starting with [env:...] )

[platformio]
default_envs = motion

[env]
board = esp32-s3-devkitc-1
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board_build.filesystem = littlefs
board_build.partitions = partitions_custom.csv
upload_speed = 921600
monitor_speed = 115200
extra_scripts = 
  pre:scripts/copy_default_config.py
  pre:scripts/define-version.py 
lib_deps = ESP32Async/ESPAsyncWebServer @ 3.10.0

[env:release]
build_unflags = -DARDUINO_USB_MODE=1
build_flags = 
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCONFIG_TINYUSB_ENABLED=1
	-DCONFIG_TINYUSB_MIDI_ENABLED=1
	-DUSE_NAMESPACE_MIDI=1
	-DASYNCWEBSERVER_REGEX
	-fpermissive
  -DCORE_DEBUG_LEVEL=3  ; should be 3 Info level for production (log_e, log_w, log_i)
	-DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384  ; Increased from default 8192 for BLE initialization
	-DASYNC_TCP_RUNNING_CORE=0
  ; -DDEBUG_WATCHDOG
  -DENABLE_SYSTEM_MONITOR  ; Enable monitoring to capture state before crash

[env:custom]
build_flags = 
	-DUSE_NAMESPACE_MIDI=1
	-DASYNCWEBSERVER_REGEX
	-fpermissive
  -DCORE_DEBUG_LEVEL=3  ; should be 3 Info level for production (log_e, log_w, log_i)
	-DASYNC_TCP_RUNNING_CORE=0
  -DENABLE_SYSTEM_MONITOR  ; Enable monitoring to capture state before crash
  ; Note: ARDUINO_USB_MODE and ARDUINO_USB_CDC_ON_BOOT are automatically set by platform
  ; based on CONFIG_TINYUSB_* settings below. Do not manually define them here.
custom_sdkconfig = 
  CONFIG_ESP_IPC_TASK_STACK_SIZE=2048
  CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
  ; Enable native Arduino TinyUSB component (arduino_tinyusb) - Device only
  CONFIG_TINYUSB_ENABLED=y
  CONFIG_TINYUSB_MIDI_ENABLED=y
  CONFIG_TINYUSB_CDC_ENABLED=y

  
	; DARDUINO_USB_CDC_ON_BOOT=1
custom_component_remove = espressif/esp_hosted
                          espressif/esp_wifi_remote
                          espressif/network_provisioning
                          ; espressif/mdns
                          espressif/esp-dsp
                          espressif/esp_modem
                          espressif/esp32-camera
                          espressif/libsodium
                          espressif/esp-modbus
                          espressif/qrcode
                          espressif/esp_insights
                          espressif/esp_diag_data_store
                          espressif/esp_diagnostics
                          espressif/cbor
                          espressif/esp_rainmaker
                          espressif/rmaker_common

[env:dev] 
; best for dev => autoupload (no need to reset board) + minimal build time + serial debug info (But no USB Midi/HID)
; Note first time using this you have to reset the board, to have the usb mode toggled, then ok
; extends = base
build_type = debug
lib_archive = yes 		
lib_ldf_mode = chain
debug_tool = esp-builtin
debug_init_break = tbreak setup
debug_speed = 921600
build_unflags= ;needed empty to override env base
build_flags=
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DDISABLE_USB_COMM 
	-DASYNCWEBSERVER_REGEX
	-fpermissive
	-DCORE_DEBUG_LEVEL=3  ; Level 3  (log_e, log_w, log_i, log_d)
	-DCONFIG_BT_NIMBLE_LOG_LEVEL=3
	-DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384  ; Increased from default 8192 for BLE initialization
	-DASYNC_TCP_RUNNING_CORE=0
	; -DPIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS ;not tested if improve anything
	-DENABLE_SYSTEM_MONITOR  ; Enable monitoring to capture state before crash
monitor_filters = esp32_exception_decoder ;not tested if improve anything

;MOTION
;REV1.0
[env:motion]
extends = env:release
build_flags=
  ${env:release.build_flags}
  -DPIPO_MOTION=1
  -DHW_REV=10
lib_extra_dirs = lib-variants/motion

