[env:range]
extends = base
build_flags=
  ${env.build_flags}
  -DPIPO_RANGE=1
lib_extra_dirs = lib-variants/range

[env:analog]
extends = base
build_flags=
  ${env.build_flags}
  -DPIPO_ANALOG=1
lib_extra_dirs = lib-variants/analog

[env:native]
platform = native
build_flags = -std=gnu++11 
 -DUNIT_TEST=1
 -Itest/stubs/prefs 
 -fpermissive
build_type = test
test_framework = doctest
lib_deps =
    ArduinoFake