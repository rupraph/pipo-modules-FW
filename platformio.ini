[env:native]
platform = native
build_flags = -std=gnu++11 
 -DUNIT_TEST=1
 -Itest/stubs/prefs
 -Itest/stubs
 -Isrc
 -fpermissive
 -Wno-missing-template-arg-list-after-template-kw
build_type = test
test_framework = doctest
lib_deps =
    ArduinoFake
    ArduinoJson