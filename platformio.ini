; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[common]
build_unflags = -DARDUINO_USB_MODE=1
build_flags = 
	-DUSE_TINYUSB=1
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DASYNCWEBSERVER_REGEX
	-fpermissive
	'-DCFG_TUSB_CONFIG_FILE="/home/leo/.platformio/packages/framework-arduinoespressif32/tools/sdk/esp32s3/include/arduino_tinyusb/include/tusb_config.h"'

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_archive = no
lib_ldf_mode = deep+
lib_deps = 
	wnatth3/WiFiManager @ 2.0.16-rc.2
	fortyseveneffects/MIDI Library@ 5.0.2
	adafruit/Adafruit TinyUSB Library@ 3.1.0
	lathoub/BLE-MIDI@ 2.2
	lathoub/AppleMIDI@ 3.3.0
	esphome/ESPAsyncWebServer-esphome@3.1.0
	esphome/AsyncTCP-esphome@2.1.1
	cnmat/OSC@1.0.0
	stm32duino/STM32duino VL53L4CX@1.1.0
	https://github.com/isouriadakis/Arduino_ICM20948_DMP_Full-Function
board_build.filesystem = littlefs
board_build.partitions = partitions_custom.csv
upload_speed = 921600
extra_scripts = pre:scripts/copy_default_config.py


[env:motion]
build_unflags=
	${common.build_unflags}
build_flags=
  ${common.build_flags}
  -DPIPO_MOTION=1

[env:range]
build_unflags=
	${common.build_unflags}
build_flags=
  ${common.build_flags}
  -DPIPO_RANGE=1

[env:analog]
build_unflags=
	${common.build_unflags}
build_flags=
  ${common.build_flags}
  -DPIPO_ANALOG=1
extra_scripts = pre:scripts/copy_default_config.py

[platformio]
default_envs = motion