name: CI

on:
  pull_request:
    branches:
      - '**'

jobs:
  platformio_build:
    name: PlatformIO Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [motion]
    steps:
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build for ${{ matrix.environment }}
        run: bash ./.github/scripts/install-pio.sh

  svelte_build:
    name: Svelte Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: web-config/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web-config/package-lock.json') }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Svelte Dependencies
        working-directory: web-config
        run: npm ci

      - name: Build Svelte App
        working-directory: web-config
        run: npm run build
